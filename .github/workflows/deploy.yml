name: deploy

on:
  push:
    branches: [main]
    paths: ['deploy/**']

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.forced }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: sleep 5
